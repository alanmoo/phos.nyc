backend:
  name: github
  repo: alanmoo/phos.nyc
  branch: main
  base_url: https://phos-cms-auth.falling-dew-aaee.workers.dev

# Publish mode: editorial_workflow enables draft/review/publish stages
publish_mode: editorial_workflow

# Where uploads will be stored
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: blog
    label: Blog
    folder: src/data/blog
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish Date, name: pubDatetime, widget: datetime }
      - { label: Description, name: description, widget: text }
      - { label: Author, name: author, widget: string, required: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Featured, name: featured, widget: boolean, default: false, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false }
      - { label: Body, name: body, widget: markdown }
