name: Deploy

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sveltia-cms-publish]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v4

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: "Use Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: "📦 Cache Vercel CLI"
        uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: npx-vercel-59.11.7

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "⬇️ Pull Vercel project settings"
        run: npx vercel@59.11.7 pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: "🏗️ Build via Vercel CLI"
        run: npx vercel@59.11.7 build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: "🚀 Deploy prebuilt output to Vercel"
        run: npx vercel@59.11.7 deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
